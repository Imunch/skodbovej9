<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deploy to GitHub Pages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#1a4d63;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
  .card{background:#fff;color:#2c3340;border-radius:16px;padding:40px;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  h1{font-size:1.4rem;color:#1a4d63;margin-bottom:6px}
  p{font-size:.9rem;color:#6b7685;margin-bottom:20px;line-height:1.6}
  .step{display:flex;gap:12px;margin-bottom:18px;align-items:flex-start}
  .step-num{width:28px;height:28px;background:#e8f1f5;color:#1a4d63;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
  .step-text{font-size:.88rem;line-height:1.6}
  .step-text a{color:#2b6e8a}
  input[type=password],input[type=text]{width:100%;padding:10px 14px;border:1px solid #e2e6eb;border-radius:8px;font-size:.9rem;font-family:inherit;margin-bottom:10px}
  input:focus{outline:none;border-color:#4a9ab5;box-shadow:0 0 0 3px rgba(43,110,138,.15)}
  .btn{padding:12px 24px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:all .15s}
  .btn-primary{background:#1a4d63;color:#fff}.btn-primary:hover{background:#2b6e8a}
  .btn-file{background:#e8f1f5;color:#1a4d63;margin-bottom:10px;border:2px dashed #4a9ab5}
  .btn-file:hover{background:#d6eaf0}
  .status{margin-top:16px;padding:12px;border-radius:8px;font-size:.85rem;display:none}
  .status.ok{display:block;background:#e8f5e9;color:#2e7d32}
  .status.err{display:block;background:#ffebee;color:#c62828}
  .status.info{display:block;background:#e8f1f5;color:#1a4d63}
  .file-name{font-size:.82rem;color:#6b7685;margin-bottom:10px}
  label{display:block;font-size:.78rem;font-weight:600;color:#6b7685;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .section{margin-bottom:24px}
  hr{border:none;border-top:1px solid #eee;margin:24px 0}
</style>
</head>
<body>
<div class="card">
  <h1>Deploy to GitHub Pages</h1>
  <p>Push your index.html to <strong>Imunch/skodbovej9</strong> with one click.</p>

  <div class="section">
    <div class="step"><div class="step-num">1</div><div class="step-text">Create a Personal Access Token at <a href="https://github.com/settings/tokens/new?description=skodbovej9-deploy&scopes=repo" target="_blank">github.com/settings/tokens</a> — check the <strong>"repo"</strong> scope, then click "Generate token".</div></div>
    <label>GitHub Token</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
  </div>

  <div class="section">
    <div class="step"><div class="step-num">2</div><div class="step-text">Select your <strong>index.html</strong> file from the Sommerhus folder.</div></div>
    <input type="file" id="filePick" accept=".html" style="display:none">
    <button class="btn btn-file" onclick="document.getElementById('filePick').click()">Choose index.html</button>
    <div class="file-name" id="fileName">No file selected</div>
  </div>

  <hr>
  <button class="btn btn-primary" onclick="deploy()">Deploy to GitHub Pages</button>
  <div class="status" id="status"></div>
</div>

<script>
let fileContent = null;
document.getElementById('filePick').addEventListener('change', function(e) {
  const f = e.target.files[0];
  if (!f) return;
  document.getElementById('fileName').textContent = f.name + ' (' + (f.size/1024).toFixed(1) + ' KB)';
  const reader = new FileReader();
  reader.onload = function(ev) { fileContent = ev.target.result; };
  reader.readAsText(f);
});

async function deploy() {
  const token = document.getElementById('token').value.trim();
  const status = document.getElementById('status');

  if (!token) { status.className='status err'; status.textContent='Please enter your GitHub token.'; return; }
  if (!fileContent) { status.className='status err'; status.textContent='Please select index.html first.'; return; }

  status.className='status info'; status.textContent='Deploying...';

  try {
    // Check if file already exists (to get its SHA for updating)
    let sha = null;
    const check = await fetch('https://api.github.com/repos/Imunch/skodbovej9/contents/index.html', {
      headers: { 'Authorization': 'token ' + token }
    });
    if (check.ok) {
      const data = await check.json();
      sha = data.sha;
    }

    // Create or update the file
    const body = {
      message: 'Deploy website update',
      content: btoa(unescape(encodeURIComponent(fileContent)))
    };
    if (sha) body.sha = sha;

    const resp = await fetch('https://api.github.com/repos/Imunch/skodbovej9/contents/index.html', {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (resp.ok) {
      status.className='status ok';
      status.innerHTML='Deployed! Your site will be live at <a href="https://imunch.github.io/skodbovej9/" target="_blank">https://imunch.github.io/skodbovej9/</a> within a minute.';
    } else {
      const err = await resp.json();
      status.className='status err';
      status.textContent='Error: ' + (err.message || resp.statusText);
    }
  } catch(e) {
    status.className='status err';
    status.textContent='Error: ' + e.message;
  }
}
</script>
</body>
</html>
